<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Changer le mot de passe</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background: linear-gradient(135deg, #0F6E56, #1a9e7a); min-height: 100vh; display: flex; align-items: center; }
        .card { border-radius: 16px; border: none; box-shadow: 0 8px 32px rgba(0,0,0,0.15); }
        .btn-primary { background: #0F6E56; border: none; }
        .btn-primary:hover { background: #0a5240; }
    </style>
</head>
<body>
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card p-4">
                <div class="text-center mb-4">
                    <i class="fas fa-lock fa-3x text-success mb-3"></i>
                    <h4 class="fw-bold">Définir votre mot de passe</h4>
                    <p class="text-muted small">C'est votre première connexion. Veuillez choisir un nouveau mot de passe.</p>
                </div>

                <div th:if="${erreur}" class="alert alert-danger" th:text="${erreur}"></div>

                <form th:action="@{/changer-mot-de-passe/{id}(id=${userId})}" method="post">
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Nouveau mot de passe</label>
                        <input type="password" name="nouveauMotDePasse" class="form-control"
                               placeholder="Minimum 6 caractères" required>
                    </div>
                    <div class="mb-4">
                        <label class="form-label fw-semibold">Confirmer le mot de passe</label>
                        <input type="password" name="confirmation" class="form-control"
                               placeholder="Répétez le mot de passe" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 py-2">
                        <i class="fas fa-check me-2"></i>Confirmer
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
</body>
</html>
