<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Nouvel étudiant</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <h2>Nouvel étudiant</h2>

    <form id="formEtudiant">
        <div class="mb-3">
            <label class="form-label">Matricule *</label>
            <input type="text" class="form-control" id="matricule" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Nom *</label>
            <input type="text" class="form-control" id="nom" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Prénom *</label>
            <input type="text" class="form-control" id="prenom" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Email *</label>
            <input type="email" class="form-control" id="email" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Niveau</label>
            <input type="text" class="form-control" id="niveau">
        </div>
        <div class="mb-3">
            <label class="form-label">Département</label>
            <select class="form-select" id="departementId">
                <!-- th:each = boucle sur les départements envoyés par le Controller -->
                <option th:each="dep : ${departements}"
                        th:value="${dep.id}"
                        th:text="${dep.nom}">
                </option>
            </select>
        </div>
        <button type="submit" class="btn btn-primary">Enregistrer</button>
        <a href="/etudiants" class="btn btn-secondary">Annuler</a>
    </form>
</div>

<script>
    document.getElementById('formEtudiant').addEventListener('submit', function(e) {
        e.preventDefault(); // empêche le rechargement de la page

        const dto = {
            matricule: document.getElementById('matricule').value,
            nom: document.getElementById('nom').value,
            prenom: document.getElementById('prenom').value,
            email: document.getElementById('email').value,
            niveau: document.getElementById('niveau').value,
            departementId: document.getElementById('departementId').value
        };

        // Appel de l'API REST
        fetch('/api/etudiants', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(dto)
        })
        .then(response => {
            if (response.ok) {
                window.location.href = '/etudiants'; // redirige vers la liste
            } else {
                alert('Erreur lors de l\'enregistrement');
            }
        });
    });
</script>
</body>
</html>
