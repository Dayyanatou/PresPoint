<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Pointage</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background:#f4f6f9; }
        .pointage-card { max-width:500px; margin:80px auto; border-radius:16px; border:none; box-shadow:0 4px 20px rgba(0,0,0,0.1); }
    </style>
</head>
<body>
<div class="container">
    <div class="card pointage-card p-4">
        <div class="text-center mb-4">
            <i class="fas fa-pen-to-square fa-3x text-primary mb-3"></i>
            <h4>Soumettre un pointage</h4>
            <p class="text-muted">Séance #<span th:text="${seanceId}"></span></p>
        </div>

        <form th:action="@{/enseignant/seance/{sid}/pointage/{eid}(sid=${seanceId},eid=${enseignant.id})}"
              method="post">
            <div class="mb-3">
                <label class="form-label fw-semibold">Heure de début effective</label>
                <input type="time" name="heureDebut" class="form-control form-control-lg" required>
            </div>
            <div class="mb-4">
                <label class="form-label fw-semibold">Heure de fin effective</label>
                <input type="time" name="heureFin" class="form-control form-control-lg" required>
            </div>
            <div class="d-grid gap-2">
                <button type="submit" class="btn btn-primary btn-lg">
                    <i class="fas fa-paper-plane me-2"></i>Soumettre le pointage
                </button>
                <a th:href="@{/enseignant/dashboard/{id}(id=${enseignant.id})}"
                   class="btn btn-outline-secondary">Annuler</a>
            </div>
        </form>
    </div>
</div>
</body>
</html>
