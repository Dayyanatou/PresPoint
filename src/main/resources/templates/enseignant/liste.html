<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Enseignants</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Ton CSS -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body class="container mt-5">

<div class="card shadow">
    <div class="card-header d-flex justify-content-between align-items-center">
        <h4>👨‍🏫 Liste des enseignants</h4>
        <a th:href="@{/enseignants/new}" class="btn btn-gold">➕ Ajouter</a>
    </div>

    <div class="card-body">

        <table class="table table-hover">
            <thead>
            <tr>
                <th>Nom</th>
                <th>Prénom</th>
                <th>Email</th>
                <th>Grade</th>
                <th>Statut</th>
                <th>Département</th>
                <th>Actions</th>
            </tr>
            </thead>

            <tbody>
            <tr th:each="e : ${enseignants}">
                <td th:text="${e.nom}"></td>
                <td th:text="${e.prenom}"></td>
                <td th:text="${e.email}"></td>
                <td th:text="${e.grade}"></td>
                <td th:text="${e.statutEnseignant}"></td>
                <td th:text="${e.departementNom}"></td>

                <td>
                    <a th:href="@{'/enseignants/edit/' + ${e.id}}" class="btn btn-sm btn-primary">✏️</a>
                    <a th:href="@{'/enseignants/delete/' + ${e.id}}" class="btn btn-sm btn-danger"
                       onclick="return confirm('Supprimer cet enseignant ?')">🗑</a>
                </td>
            </tr>
            </tbody>

        </table>

    </div>
</div>

</body>
</html>
