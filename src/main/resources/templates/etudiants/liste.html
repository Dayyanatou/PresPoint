<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Liste des Étudiants</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body class="bg-light">

<div class="container mt-5">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="text-success fw-bold d-flex align-items-center gap-2">
            🎓 Liste des Étudiants
        </h2>
        <a th:href="@{/etudiants/new}" class="btn btn-success btn-lg shadow">
            <i class="bi bi-plus-circle me-2"></i> Nouvel Étudiant
        </a>
    </div>

    <!-- Message d'erreur -->
    <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show">
        <strong>Erreur :</strong> <span th:text="${errorMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="card shadow border-0">
        <div class="card-body p-0">
            <table class="table table-hover mb-0 align-middle">
                <thead class="table-success">
                <tr>
                    <th>Matricule</th>
                    <th>Nom Complet</th>
                    <th>Email</th>
                    <th>Téléphone</th>
                    <th>Niveau</th>
                    <th>Département</th>
                    <th>Statut</th>
                    <th class="text-center">Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="e : ${etudiants}">
                    <td th:text="${e.matricule}"></td>
                    <td th:text="${e.nom + ' ' + e.prenom}"></td>
                    <td th:text="${e.email}"></td>
                    <td th:text="${e.telephone}"></td>
                    <td th:text="${e.niveau}"></td>
                    <td th:text="${e.departementNom}"></td>
                    <td>
                        <span th:if="${e.statut}" class="badge bg-success px-3 py-2">Actif</span>
                        <span th:if="${!e.statut}" class="badge bg-danger px-3 py-2">Inactif</span>
                    </td>
                    <td class="text-center">
                        <div class="d-flex justify-content-center gap-2">
                            <!-- Bouton Modifier -->
                            <a th:href="@{/etudiants/edit/{id}(id=${e.id})}"
                               class="btn btn-warning btn-sm">
                                <i class="bi bi-pencil-square"></i> Modifier
                            </a>

                            <!-- Bouton Supprimer -->
                            <form th:action="@{/etudiants/delete/{id}(id=${e.id})}"
                                  method="post" style="display: inline;">
                                <button type="submit"
                                        class="btn btn-danger btn-sm"
                                        onclick="return confirm('Voulez-vous vraiment supprimer cet étudiant ?')">
                                    <i class="bi bi-trash"></i> Supprimer
                                </button>
                            </form>
                        </div>
                    </td>
                </tr>

                <tr th:if="${#lists.isEmpty(etudiants)}">
                    <td colspan="8" class="text-center py-5 text-muted">
                        Aucun étudiant enregistré pour le moment.
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

</body>
</html>
