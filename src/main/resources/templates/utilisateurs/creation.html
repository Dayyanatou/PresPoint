<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Création de compte utilisateur</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="card shadow-lg">
        <div class="card-header bg-success text-white">
            <h3 class="mb-0">Création de compte utilisateur</h3>
        </div>
        <div class="card-body">

            <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
            <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

            <form th:action="@{/utilisateurs/save}" th:object="${utilisateurDto}" method="post">
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Nom</label>
                        <input type="text" class="form-control" th:field="*{nom}">
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Prénom</label>
                        <input type="text" class="form-control" th:field="*{prenom}">
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label">Email</label>
                    <input type="email" class="form-control" th:field="*{email}">
                </div>

                <div class="mb-3">
                    <label class="form-label">Nom d'utilisateur</label>
                    <input type="text" class="form-control" th:field="*{nomUtilisateur}">
                </div>

                <div class="mb-3">
                    <label class="form-label">Téléphone</label>
                    <input type="text" class="form-control" th:field="*{telephone}">
                </div>

                <div class="mb-3">
                    <label class="form-label">Rôle</label>
                    <select class="form-select" th:field="*{role}">
                        <option value="">-- Choisir un rôle --</option>
                        <option value="ADMIN">ADMIN</option>
                        <option value="ENSEIGNANT">ENSEIGNANT</option>
                        <option value="ETUDIANT">ETUDIANT</option>
                    </select>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Mot de passe</label>
                        <input type="password" class="form-control" th:field="*{motDePasse}">
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Confirmation</label>
                        <input type="password" class="form-control" th:field="*{confirmationMotDePasse}">
                    </div>
                </div>

                <button type="submit" class="btn btn-success">Créer le compte</button>
                <a th:href="@{/utilisateurs}" class="btn btn-secondary">Voir les utilisateurs</a>
            </form>
        </div>
    </div>
</div>

</body>
</html>
