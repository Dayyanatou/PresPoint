<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Connexion — FST Présence</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #0F6E56 0%, #1a9e7a 100%);
            min-height: 100vh; display: flex; align-items: center;
            font-family: 'Segoe UI', sans-serif;
        }
        .login-card {
            border-radius: 20px; border: none;
            box-shadow: 0 20px 60px rgba(0,0,0,0.2);
            overflow: hidden;
        }
        .login-header {
            background: linear-gradient(135deg, #0F6E56, #1a9e7a);
            padding: 32px; text-align: center; color: white;
        }
        .login-body { padding: 32px; }
        .form-control {
            border-radius: 10px; padding: 12px 16px;
            border: 1.5px solid #e0e0e0;
        }
        .form-control:focus {
            border-color: #0F6E56;
            box-shadow: 0 0 0 3px rgba(15,110,86,0.15);
        }
        .btn-login {
            background: linear-gradient(135deg, #0F6E56, #1a9e7a);
            border: none; border-radius: 10px;
            padding: 12px; font-weight: 600; color: white;
            transition: all 0.2s;
        }
        .btn-login:hover { opacity: 0.9; transform: translateY(-1px); color: white; }
        .input-group-text { background: #f8f9fa; border-radius: 10px 0 0 10px; }
    </style>
</head>
<body>
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-5 col-lg-4">
            <div class="login-card card">

                <!-- En-tête -->
                <div class="login-header">
                    <i class="fas fa-university fa-3x mb-3"></i>
                    <h4 class="fw-bold mb-1">FST Présence</h4>
                    <p class="mb-0 opacity-75 small">Faculté des Sciences et Techniques</p>
                </div>

                <!-- Corps -->
                <div class="login-body">
                    <h5 class="fw-bold mb-4 text-center">Connexion</h5>

                    <!-- Messages -->
                    <div th:if="${erreur}" class="alert alert-danger py-2 small" th:text="${erreur}"></div>
                    <div th:if="${param.deconnecte}" class="alert alert-info py-2 small">
                        Vous avez été déconnecté avec succès.
                    </div>
                    <div th:if="${param.mdpChange}" class="alert alert-success py-2 small">
                        Mot de passe modifié ! Connectez-vous avec votre nouveau mot de passe.
                    </div>

                    <!-- Formulaire -->
                    <form th:action="@{/login}" method="post">
                        <div class="mb-3">
                            <label class="form-label fw-semibold small">Nom d'utilisateur</label>
                            <div class="input-group">
                                <span class="input-group-text">
                                    <i class="fas fa-user text-muted"></i>
                                </span>
                                <input type="text" name="username" class="form-control"
                                       placeholder="Votre identifiant" required autofocus>
                            </div>
                        </div>
                        <div class="mb-4">
                            <label class="form-label fw-semibold small">Mot de passe</label>
                            <div class="input-group">
                                <span class="input-group-text">
                                    <i class="fas fa-lock text-muted"></i>
                                </span>
                                <input type="password" name="motDePasse" class="form-control"
                                       placeholder="Votre mot de passe" required>
                            </div>
                        </div>
                        <button type="submit" class="btn btn-login w-100">
                            <i class="fas fa-sign-in-alt me-2"></i>Se connecter
                        </button>
                    </form>

                    <!-- Comptes de test rapide -->
                    <hr class="my-4">
                    <p class="text-muted small text-center mb-2">Connexions rapides (test)</p>
                    <div class="d-flex gap-2 flex-wrap justify-content-center">
                        <button class="btn btn-sm btn-outline-secondary"
                                onclick="document.querySelector('[name=username]').value='aichat';document.querySelector('[name=motDePasse]').value='2204018'">
                            Étudiant
                        </button>
                        <button class="btn btn-sm btn-outline-secondary"
                                onclick="document.querySelector('[name=username]').value='mdiallo';document.querySelector('[name=motDePasse]').value='mdiallo@fst.ne'">
                            Enseignant
                        </button>
                        <button class="btn btn-sm btn-outline-secondary"
                                onclick="document.querySelector('[name=username]').value='admin';document.querySelector('[name=motDePasse]').value='admin'">
                            Admin
                        </button>
                    </div>
                </div>

            </div>
            <p class="text-center text-white mt-3 small opacity-75">
                © 2026 FST Niamey — Système de gestion des présences
            </p>
        </div>
    </div>
</div>
</body>
</html>
