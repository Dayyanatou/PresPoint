<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Département</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">

    <div class="card shadow">
        <div class="card-header bg-primary text-white">
            <h4 th:text="${departement.id == null} ? 'Ajouter' : 'Modifier'"></h4>
        </div>

        <div class="card-body">

            <form th:action="@{/departements}" th:object="${departement}" method="post">

                <div class="mb-3">
                    <label>Nom du département</label>
                    <input type="text" th:field="*{nom}" class="form-control" required>
                </div>

                <div class="d-flex justify-content-between">
                    <a th:href="@{/departements}" class="btn btn-secondary">⬅ Retour</a>
                    <button class="btn btn-primary">💾 Enregistrer</button>
                </div>

            </form>

        </div>
    </div>

</div>

</body>
</html>
