<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Départements</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">

    <div class="d-flex justify-content-between mb-4">
        <h2 class="text-primary">🏫 Départements</h2>
        <a th:href="@{/departements/new}" class="btn btn-success">➕ Ajouter</a>
    </div>

    <div class="card shadow">
        <div class="card-body">

            <table class="table table-hover">
                <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Nom</th>
                    <th>Actions</th>
                </tr>
                </thead>

                <tbody>
                <tr th:each="d : ${departements}">
                    <td th:text="${d.id}"></td>
                    <td th:text="${d.nom}"></td>

                    <td>
                        <a th:href="@{/departements/edit/{id}(id=${d.id})}"
                           class="btn btn-warning btn-sm">✏️</a>

                        <a th:href="@{/departements/delete/{id}(id=${d.id})}"
                           class="btn btn-danger btn-sm"
                           onclick="return confirm('Supprimer ?')">🗑</a>
                    </td>
                </tr>
                </tbody>

            </table>

        </div>
    </div>

</div>

</body>
</html>
