    <h3 class="mb-4"><i class="fas fa-users-cog me-2 text-emerald"></i>Gestion des comptes</h3>

    &lt;!&ndash; Alertes &ndash;&gt;
    <div th:if="${param.succes}" class="alert alert-success alert-dismissible fade show">
        <i class="fas fa-check-circle me-2"></i>Compte créé avec succès !
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${param.erreur}" class="alert alert-danger alert-dismissible fade show">
        <i class="fas fa-exclamation-circle me-2"></i>
        <span th:text="${param.erreur}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    &lt;!&ndash; Onglets création &ndash;&gt;
    <div class="card border-0 shadow-sm mb-4">
        <div class="card-header bg-white border-0">
            <ul class="nav nav-tabs" id="comptesTabs">
                <li class="nav-item">
                    <a class="nav-link active" data-bs-toggle="tab" href="#etudiant">
                        <i class="fas fa-user-graduate me-1"></i>Étudiant
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" data-bs-toggle="tab" href="#enseignant">
                        <i class="fas fa-chalkboard-teacher me-1"></i>Enseignant
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" data-bs-toggle="tab" href="#chef">
                        <i class="fas fa-user-tie me-1"></i>Chef de département
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" data-bs-toggle="tab" href="#superviseur">
                        <i class="fas fa-user-shield me-1"></i>Superviseur
                    </a>
                </li>
            </ul>
        </div>
        <div class="card-body">
            <div class="tab-content">

                &lt;!&ndash; Étudiant &ndash;&gt;
                <div class="tab-pane fade show active" id="etudiant">
                    <form action="/admin/comptes/etudiant" method="post">
                        <div class="row g-3">
                            <div class="col-md-4">
                                <label class="form-label">Nom</label>
                                <input type="text" name="nom" class="form-control" required>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">Prénom</label>
                                <input type="text" name="prenom" class="form-control" required>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">Email</label>
                                <input type="email" name="email" class="form-control" required>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">Username</label>
                                <input type="text" name="username" class="form-control" required>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">Matricule</label>
                                <input type="text" name="matricule" class="form-control" required>
                                <small class="text-muted">Sera utilisé comme mot de passe initial</small>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">Niveau</label>
                                <select name="niveau" class="form-select">
                                    <option value="Bachelor1">Bachelor 1</option>
                                    <option value="Bachelor2">Bachelor 2</option>
                                    <option value="Bachelor3">Bachelor 3</option>
                                    <option value="Bachelor4">Bachelor 4</option>
                                    <option value="M2">Master</option>
                                </select>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">Département</label>
                                <select name="departementId" class="form-select">
                                    <option th:each="d : ${departements}"
                                            th:value="${d.id}"
                                            th:text="${d.nom}"></option>
                                </select>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">Téléphone</label>
                                <input type="text" name="telephone" class="form-control">
                            </div>
                            <div class="col-12">
                                <button type="submit" class="btn btn-emerald">
                                    <i class="fas fa-plus me-2"></i>Créer le compte étudiant
                                </button>
                            </div>
                        </div>
                    </form>
                </div>

                &lt;!&ndash; Enseignant &ndash;&gt;
                <div class="tab-pane fade" id="enseignant">
                    <form action="/admin/comptes/enseignant" method="post">
                        <div class="row g-3">
                            <div class="col-md-4">
                                <label class="form-label">Nom</label>
                                <input type="text" name="nom" class="form-control" required>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">Prénom</label>
                                <input type="text" name="prenom" class="form-control" required>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">Email</label>
                                <input type="email" name="email" class="form-control" required>
                                <small class="text-muted">Sera utilisé comme mot de passe initial</small>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">Username</label>
                                <input type="text" name="username" class="form-control" required>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">Grade</label>
                                <select name="grade" class="form-select">
                                    <option value="Assistant">Assistant</option>
                                    <option value="Maître Assistant">Maître Assistant</option>
                                    <option value="Maître de Conférences">Maître de Conférences</option>
                                    <option value="Professeur">Professeur</option>
                                </select>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">Spécialité</label>
                                <input type="text" name="specialite" class="form-control">
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">Téléphone</label>
                                <input type="text" name="telephone" class="form-control">
                            </div>
                            <div class="col-12">
                                <button type="submit" class="btn btn-emerald">
                                    <i class="fas fa-plus me-2"></i>Créer le compte enseignant
                                </button>
                            </div>
                        </div>
                    </form>
                </div>

                &lt;!&ndash; Chef département &ndash;&gt;
                <div class="tab-pane fade" id="chef">
                    <form action="/admin/comptes/chef" method="post">
                        <div class="row g-3">
                            <div class="col-md-4">
                                <label class="form-label">Nom</label>
                                <input type="text" name="nom" class="form-control" required>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">Prénom</label>
                                <input type="text" name="prenom" class="form-control" required>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">Email</label>
                                <input type="email" name="email" class="form-control" required>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">Username</label>
                                <input type="text" name="username" class="form-control" required>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">Téléphone</label>
                                <input type="text" name="telephone" class="form-control">
                            </div>
                            <div class="col-12">
                                <button type="submit" class="btn btn-emerald">
                                    <i class="fas fa-plus me-2"></i>Créer le compte chef
                                </button>
                            </div>
                        </div>
                    </form>
                </div>

                &lt;!&ndash; Superviseur &ndash;&gt;
                <div class="tab-pane fade" id="superviseur">
                    <form action="/admin/comptes/superviseur" method="post">
                        <div class="row g-3">
                            <div class="col-md-4">
                                <label class="form-label">Nom</label>
                                <input type="text" name="nom" class="form-control" required>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">Prénom</label>
                                <input type="text" name="prenom" class="form-control" required>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">Email</label>
                                <input type="email" name="email" class="form-control" required>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">Username</label>
                                <input type="text" name="username" class="form-control" required>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">Téléphone</label>
                                <input type="text" name="telephone" class="form-control">
                            </div>
                            <div class="col-12">
                                <button type="submit" class="btn btn-emerald">
                                    <i class="fas fa-plus me-2"></i>Créer le compte superviseur
                                </button>
                            </div>
                        </div>
                    </form>
                </div>

            </div>
        </div>
    </div>

    &lt;!&ndash; Liste des utilisateurs &ndash;&gt;
    <div class="card border-0 shadow-sm">
        <div class="card-header bg-white border-0 pt-3">
            <h5><i class="fas fa-users me-2 text-emerald"></i>Tous les utilisateurs</h5>
        </div>
        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-hover align-middle">
                    <thead class="table-light">
                    <tr>
                        <th>Nom</th><th>Prénom</th><th>Username</th>
                        <th>Email</th><th>Rôle</th><th>Statut</th><th>Actions</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="u : ${utilisateurs}">
                        <td th:text="${u.nom}"></td>
                        <td th:text="${u.prenom}"></td>
                        <td><code th:text="${u.username}"></code></td>
                        <td th:text="${u.email}"></td>
                        <td>
                            <span class="badge"
                                  th:classappend="${u.role.name() == 'ETUDIANT'} ? 'bg-info' :
                                                  (${u.role.name() == 'ENSEIGNANT'} ? 'bg-emerald' :
                                                  (${u.role.name() == 'CHEF_DEPARTEMENT'} ? 'bg-warning text-dark' : 'bg-success'))"
                                  th:text="${u.role}"></span>
                        </td>
                        <td>
                            <span th:if="${u.statut}" class="badge bg-emerald">Actif</span>
                            <span th:unless="${u.statut}" class="badge bg-danger">Inactif</span>
                        </td>
                        <td>
                            <form th:if="${u.statut}" th:action="@{/admin/comptes/{id}/desactiver(id=${u.id})}"
                                  method="post" class="d-inline">
                                <button class="btn btn-sm btn-outline-emerald">Désactiver</button>
                            </form>
                            <form th:unless="${u.statut}" th:action="@{/admin/comptes/{id}/activer(id=${u.id})}"
                                  method="post" class="d-inline">
                                <button class="btn btn-sm btn-outline-emerald">Activer</button>
                            </form>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

&lt;!&ndash; Scripts JavaScript (Bootstrap pour les interactions) &ndash;&gt;
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
&lt;!&ndash; NOTRE SCRIPT PERSONNALISÉ &ndash;&gt;
<script src="/js/comptes.js"></script>
</body>
</html>
-->




<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Gestion des comptes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="/css/comptes.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container-fluid py-4">
    <h3 class="mb-4"><i class="fas fa-users-cog me-2 text-emerald"></i>Gestion des comptes</h3>

    <!-- Alertes -->
    <div th:if="${param.succes}" class="alert alert-success alert-dismissible fade show">
        <i class="fas fa-check-circle me-2"></i>Compte créé avec succès !
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${param.erreur}" class="alert alert-danger alert-dismissible fade show">
        <i class="fas fa-exclamation-circle me-2"></i>
        <span th:text="${param.erreur}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <!-- SECTION 1 : BOUTONS D'ACTION -->
    <div class="card border-0 shadow-sm mb-4">
        <div class="card-header bg-white border-0 pt-3">
            <h5><i class="fas fa-plus-circle me-2 text-emerald"></i>Créer un nouveau compte</h5>
        </div>
        <div class="card-body">
            <div class="row g-2">
                <div class="col-auto">
                    <button class="btn btn-emerald" data-bs-toggle="collapse" data-bs-target="#formEtudiant">
                        <i class="fas fa-user-graduate me-1"></i>+ Créer un Étudiant
                    </button>
                </div>
                <div class="col-auto">
                    <button class="btn btn-emerald" data-bs-toggle="collapse" data-bs-target="#formEnseignant">
                        <i class="fas fa-chalkboard-teacher me-1"></i>+ Créer un Enseignant
                    </button>
                </div>
                <div class="col-auto">
                    <button class="btn btn-emerald" data-bs-toggle="collapse" data-bs-target="#formChef">
                        <i class="fas fa-user-tie me-1"></i>+ Créer un Chef
                    </button>
                </div>
                <div class="col-auto">
                    <button class="btn btn-emerald" data-bs-toggle="collapse" data-bs-target="#formSuperviseur">
                        <i class="fas fa-user-shield me-1"></i>+ Créer un Superviseur
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- FORMULAIRES COLLAPSIBLES -->

    <!-- Formulaire ÉTUDIANT -->
    <div class="collapse mb-4" id="formEtudiant">
        <div class="card border-0 shadow-sm">
            <div class="card-header bg-emerald text-white">
                <h6 class="mb-0"><i class="fas fa-user-graduate me-2"></i>Créer un Étudiant</h6>
            </div>
            <div class="card-body">
                <form action="/admin/comptes/etudiant" method="post">
                    <div class="row g-3">
                        <div class="col-md-4">
                            <label class="form-label">Nom</label>
                            <input type="text" name="nom" class="form-control" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Prénom</label>
                            <input type="text" name="prenom" class="form-control" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Email</label>
                            <input type="email" name="email" class="form-control" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Username</label>
                            <input type="text" name="username" class="form-control" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Matricule</label>
                            <input type="text" name="matricule" class="form-control" required>
                            <small class="text-muted">Mot de passe initial</small>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Niveau</label>
                            <select name="niveau" class="form-select">
                                <option value="L1">L1</option>
                                <option value="L2">L2</option>
                                <option value="L3">L3</option>
                                <option value="M1">M1</option>
                                <option value="M2">M2</option>
                            </select>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Département</label>
                            <select name="departementId" class="form-select">
                                <option th:each="d : ${departements}"
                                        th:value="${d.id}"
                                        th:text="${d.nom}"></option>
                            </select>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Téléphone</label>
                            <input type="text" name="telephone" class="form-control">
                        </div>
                        <div class="col-12">
                            <button type="submit" class="btn btn-emerald">
                                <i class="fas fa-plus me-2"></i>Créer l'étudiant
                            </button>
                            <button type="button" class="btn btn-secondary ms-2" data-bs-toggle="collapse" data-bs-target="#formEtudiant">
                                Annuler
                            </button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Formulaire ENSEIGNANT -->
    <div class="collapse mb-4" id="formEnseignant">
        <div class="card border-0 shadow-sm">
            <div class="card-header bg-emerald text-white">
                <h6 class="mb-0"><i class="fas fa-chalkboard-teacher me-2"></i>Créer un Enseignant</h6>
            </div>
            <div class="card-body">
                <form action="/admin/comptes/enseignant" method="post">
                    <div class="row g-3">
                        <div class="col-md-4">
                            <label class="form-label">Nom</label>
                            <input type="text" name="nom" class="form-control" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Prénom</label>
                            <input type="text" name="prenom" class="form-control" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Email</label>
                            <input type="email" name="email" class="form-control" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Username</label>
                            <input type="text" name="username" class="form-control" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Grade</label>
                            <select name="grade" class="form-select">
                                <option value="Assistant">Assistant</option>
                                <option value="Maître Assistant">Maître Assistant</option>
                                <option value="Maître de Conférences">Maître de Conférences</option>
                                <option value="Professeur">Professeur</option>
                            </select>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Spécialité</label>
                            <input type="text" name="specialite" class="form-control">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Téléphone</label>
                            <input type="text" name="telephone" class="form-control">
                        </div>
                        <div class="col-12">
                            <button type="submit" class="btn btn-emerald">
                                <i class="fas fa-plus me-2"></i>Créer l'enseignant
                            </button>
                            <button type="button" class="btn btn-secondary ms-2" data-bs-toggle="collapse" data-bs-target="#formEnseignant">
                                Annuler
                            </button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Formulaire CHEF -->
    <div class="collapse mb-4" id="formChef">
        <div class="card border-0 shadow-sm">
            <div class="card-header bg-emerald text-white">
                <h6 class="mb-0"><i class="fas fa-user-tie me-2"></i>Créer un Chef de département</h6>
            </div>
            <div class="card-body">
                <form action="/admin/comptes/chef" method="post">
                    <div class="row g-3">
                        <div class="col-md-4">
                            <label class="form-label">Nom</label>
                            <input type="text" name="nom" class="form-control" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Prénom</label>
                            <input type="text" name="prenom" class="form-control" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Email</label>
                            <input type="email" name="email" class="form-control" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Username</label>
                            <input type="text" name="username" class="form-control" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Téléphone</label>
                            <input type="text" name="telephone" class="form-control">
                        </div>
                        <div class="col-12">
                            <button type="submit" class="btn btn-emerald">
                                <i class="fas fa-plus me-2"></i>Créer le chef
                            </button>
                            <button type="button" class="btn btn-secondary ms-2" data-bs-toggle="collapse" data-bs-target="#formChef">
                                Annuler
                            </button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Formulaire SUPERVISEUR -->
    <div class="collapse mb-4" id="formSuperviseur">
        <div class="card border-0 shadow-sm">
            <div class="card-header bg-emerald text-white">
                <h6 class="mb-0"><i class="fas fa-user-shield me-2"></i>Créer un Superviseur</h6>
            </div>
            <div class="card-body">
                <form action="/admin/comptes/superviseur" method="post">
                    <div class="row g-3">
                        <div class="col-md-4">
                            <label class="form-label">Nom</label>
                            <input type="text" name="nom" class="form-control" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Prénom</label>
                            <input type="text" name="prenom" class="form-control" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Email</label>
                            <input type="email" name="email" class="form-control" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Username</label>
                            <input type="text" name="username" class="form-control" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Téléphone</label>
                            <input type="text" name="telephone" class="form-control">
                        </div>
                        <div class="col-12">
                            <button type="submit" class="btn btn-emerald">
                                <i class="fas fa-plus me-2"></i>Créer le superviseur
                            </button>
                            <button type="button" class="btn btn-secondary ms-2" data-bs-toggle="collapse" data-bs-target="#formSuperviseur">
                                Annuler
                            </button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- SECTION 2 : LISTE DES UTILISATEURS -->
    <div class="card border-0 shadow-sm mt-4">
        <div class="card-header bg-white border-0 pt-3">
            <h5><i class="fas fa-users me-2 text-emerald"></i>Gestion des utilisateurs existants</h5>
        </div>
        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-hover align-middle">
                    <thead class="table-light">
                    <tr>
                        <th>Nom</th><th>Prénom</th><th>Username</th>
                        <th>Email</th><th>Rôle</th><th>Statut</th><th>Actions</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="u : ${utilisateurs}">
                        <td th:text="${u.nom}"></td>
                        <td th:text="${u.prenom}"></td>
                        <td><code th:text="${u.username}"></code></td>
                        <td th:text="${u.email}"></td>
                        <td>
                            <span class="badge"
                                  th:classappend="${u.role.name() == 'ETUDIANT'} ? 'bg-info' :
                                                  (${u.role.name() == 'ENSEIGNANT'} ? 'bg-emerald' :

                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

</div>
