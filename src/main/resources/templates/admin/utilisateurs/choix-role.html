<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Création de compte</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">

</head>
<body>
<h2>Créer un compte</h2>

<div class="cards">

    <div class="card" onclick="go('ETUDIANT')">👨‍🎓 Étudiant</div>
    <div class="card" onclick="go('ENSEIGNANT')">👨‍🏫 Enseignant</div>

</div>

<script>
    function go(role) {
        if(role === "ETUDIANT") {
            window.location.href = "/etudiants/new";
        }
        if(role === "ENSEIGNANT") {
            window.location.href = "/enseignants/new";
        }
    }
</script>
